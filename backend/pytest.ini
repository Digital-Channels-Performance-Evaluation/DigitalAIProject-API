[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: marks tests that require a live database (deselect with -m "not integration")
    unit: marks pure unit tests with no external dependencies

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Log level during tests
log_cli = false
log_level = WARNING
