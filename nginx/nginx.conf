worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream servers
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    # ── HTTP server — redirects everything to HTTPS ──────────────────────────
    # In local dev (no certs), you can comment out this block and use the HTTP
    # server below directly.
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge through without redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server (production) ────────────────────────────────────────────
    # Place your TLS certificate and key at:
    #   nginx/ssl/fullchain.pem   (certificate + chain)
    #   nginx/ssl/privkey.pem     (private key)
    # Then mount the nginx/ssl/ directory into the container (see docker-compose.yml).
    #
    # For local development without certs, replace this block with the plain
    # HTTP server block shown at the bottom of this file.
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS settings (Mozilla Intermediate config)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           DENY                              always;
        add_header X-Content-Type-Options    nosniff                           always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';" always;

        client_max_body_size 50M;

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout    300;
            proxy_connect_timeout  60;
            # Do not cache API responses in Nginx — let the app control caching
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Auth — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store" always;
        }

        # API docs (consider restricting to internal networks in production)
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Next.js static chunks — aggressively cached (content-hashed filenames) ──
        location ~* ^/_next/static/ {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Next.js hashes chunk filenames — safe to cache for 1 year
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # ── Public static files (favicon, images, etc.) ───────────────────────
        location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?|ttf|eot)$ {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header Cache-Control "public, max-age=86400" always;  # 1 day
            access_log off;
        }

        # Frontend
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade         $http_upgrade;
            proxy_set_header   Connection      'upgrade';
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check (no access log, internal use)
        location /health {
            proxy_pass http://backend_api;
            access_log off;
        }
    }

    # ── LOCAL DEVELOPMENT (HTTP only, no certs) ──────────────────────────────
    # Uncomment this block and comment out the two server blocks above when
    # running locally without TLS certificates.
    #
    # server {
    #     listen 80;
    #     server_name _;
    #
    #     add_header X-Frame-Options        DENY    always;
    #     add_header X-Content-Type-Options nosniff always;
    #
    #     client_max_body_size 50M;
    #
    #     location /api/ {
    #         limit_req zone=api burst=20 nodelay;
    #         proxy_pass         http://backend_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host            $host;
    #         proxy_set_header   X-Real-IP       $remote_addr;
    #         proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_read_timeout 300;
    #     }
    #
    #     location /api/auth/ {
    #         limit_req zone=auth burst=5 nodelay;
    #         proxy_pass         http://backend_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host $host;
    #     }
    #
    #     location / {
    #         proxy_pass         http://frontend_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host    $host;
    #         proxy_set_header   Upgrade $http_upgrade;
    #         proxy_set_header   Connection 'upgrade';
    #     }
    #
    #     location /health {
    #         proxy_pass http://backend_api;
    #         access_log off;
    #     }
    # }
}
